<!doctype html>
<!-- This is the default template for 'html' output format of the tool -->
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5DNFBHR');
  </script>
  <!-- End Google Tag Manager -->
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#4F7DC9">
  <meta charset="UTF-8">
  <title>{{.Meta.Title}}</title>
  <link rel="canonical" href="https://quickstarts.sigmacomputing.com/guide/{{.Meta.ID}}/index.html" />
  <meta name="description" content="{{.Meta.Summary}}">
  <meta name="og:type" property="og:type" content="article">
  <meta name="og:title" property="og:title" content="{{.Meta.Title}}">
  <meta name="og:description" property="og:description" content="{{.Meta.Summary}}">
  <meta name="og:url" property="og:url" content="https://quickstarts.sigmacomputing.com/guide/{{.Meta.ID}}/index.html">
  <meta name="og:site_name" property="og:site_name" content="Sigma Quickstarts">
  <meta name="twitter:card" property="twitter:card" content="summary">
  <meta name="twitter:title" property="twitter:title" content="{{.Meta.Title}}">
  <meta name="twitter:description" property="twitter:description" content="{{.Meta.Summary}}">
  <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Source+Code+Pro:400|Roboto:400,300,400italic,500,700|Roboto+Mono">
  <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="//fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="{{.Prefix}}/codelab-elements/codelab-elements.css">
  <style>
    .success {
      color: #1e8e3e;
    }
    .error {
      color: red;
    }
    @font-face {
      font-family: 'Advercase';
      src: url('/fonts/advercase-regular.woff2') format('woff2'),
           url('/fonts/advercase-regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Advercase';
      src: url('/fonts/advercase-bold.woff2') format('woff2'),
           url('/fonts/advercase-bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    body {
      font-family: 'DM Sans', sans-serif !important;
    }
    google-codelab-step .instructions {
      max-width: 900px !important;
      font-size: 16px !important;
    }
    google-codelab-step h2.step-title,
    google-codelab #codelab-title h1 {
      font-family: 'Advercase', serif !important;
    }
    .local-video {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      margin: auto !important;
    }
    google-codelab #codelab-title .sigma-logo-link {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 78px;
      height: 24px;
      background-image: url('/images/logo-sigma-black.svg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5DNFBHR"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <!-- OLD TAG MANAGER 
  <google-codelab-analytics gaid="{{.GlobalGA}}"></google-codelab-analytics>
      OLD TAG MANAGER -->
  <google-codelab codelab-gaid="{{.Meta.GA}}"
                  id="{{.Meta.ID}}"
                  title="{{.Meta.Title}}"
                  environment="{{index .Env}}"
                  feedback-link="{{.Meta.Feedback}}">
    {{range $i, $e := .Steps}}{{if matchEnv .Tags $.Env}}
      <google-codelab-step label="{{.Title}}" duration="{{.Duration.Minutes}}">
        {{.Content | renderHTML $.Context}}
      </google-codelab-step>
    {{end}}{{end}}
  </google-codelab>

  <script src="{{.Prefix}}/codelab-elements/native-shim.js"></script>
  <script src="{{.Prefix}}/codelab-elements/custom-elements.min.js"></script>
  <script src="{{.Prefix}}/codelab-elements/prettify.js"></script>
  <script src="{{.Prefix}}/codelab-elements/codelab-elements.js"></script>
  <script src="{{.Prefix}}/codelab-elements/code-copy.js"></script>
  <script src="//support.google.com/inapp/api.js"></script>
  <script>
    (function() {
      function addLogoLink() {
        var titleBar = document.querySelector('#codelab-title');
        if (!titleBar || titleBar.querySelector('.sigma-logo-link')) return false;
        var link = document.createElement('a');
        link.href = 'https://www.sigmacomputing.com/';
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'sigma-logo-link';
        link.setAttribute('aria-label', 'Sigma Computing');
        titleBar.appendChild(link);
        return true;
      }
      if (!addLogoLink()) {
        var observer = new MutationObserver(function() {
          if (addLogoLink()) observer.disconnect();
        });
        observer.observe(document.body, {childList: true, subtree: true});
      }
    })();
  </script>
  <script>
    // The Material Icons webfont uses ligature text ("close", "menu") that
    // renders as literal words if the font is slow to load or fails to swap
    // in. Swap those ligature icons for inline SVGs so the close/menu
    // buttons never depend on a third-party font loading successfully.
    (function() {
      var ICONS = {
        '#arrow-back': '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>',
        '#menu': '<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>'
      };
      function replaceIcons() {
        var replacedAll = true;
        for (var selector in ICONS) {
          var icon = document.querySelector(selector + ' i.material-icons');
          if (!icon) {
            replacedAll = false;
            continue;
          }
          var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('class', 'material-icons');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('width', '24');
          svg.setAttribute('height', '24');
          svg.setAttribute('fill', 'currentColor');
          svg.setAttribute('aria-hidden', 'true');
          svg.innerHTML = ICONS[selector];
          icon.replaceWith(svg);
        }
        return replacedAll;
      }
      if (!replaceIcons()) {
        var observer = new MutationObserver(function() {
          if (replaceIcons()) observer.disconnect();
        });
        observer.observe(document.body, {childList: true, subtree: true});
      }
    })();
  </script>
</body>
</html>
