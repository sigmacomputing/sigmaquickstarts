<text x="1090" y="691" text-anchor="middle" font-size="12" fill="#5F5F66" dominant-baseline="central">(single iframe)</text>

<line x1="762" y1="425" x2="978" y2="425" stroke="#5F5F66" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="870" y="409" text-anchor="middle" font-size="12.5" fill="#111114" dominant-baseline="central">4 Create or update</text>

<line x1="762" y1="680" x2="978" y2="680" stroke="#5F5F66" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="870" y="664" text-anchor="middle" font-size="12.5" fill="#111114" dominant-baseline="central">5 Signed embed URL</text>

<line x1="1090" y1="480" x2="1090" y2="526" stroke="#5F5F66" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="1100" y="496" font-size="12.5" fill="#111114" dominant-baseline="central">6 Save as my</text>
<text x="1100" y="511" font-size="12.5" fill="#111114" dominant-baseline="central">workbook</text>

<path d="M980 568 L830 568 L830 455 L762 455" fill="none" stroke="#5F5F66" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="840" y="520" font-size="12.5" fill="#111114" dominant-baseline="central">7 List saved</text>
<text x="840" y="535" font-size="12.5" fill="#111114" dominant-baseline="central">workbooks</text>

<path d="M1200 440 L1230 440 L1230 680 L1202 680" fill="none" stroke="#5F5F66" stroke-width="1.2" marker-end="url(#ar)"/>
