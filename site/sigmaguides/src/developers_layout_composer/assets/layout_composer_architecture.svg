</defs>
<rect width="1320" height="790" fill="#FFFFFF"/>
<text x="30" y="44" font-size="24" font-weight="600" fill="#111114" dominant-baseline="central">Layout Composer</text>

<rect x="30" y="80" width="300" height="640" rx="14" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.5"/>
<text x="50" y="104" font-size="15" font-weight="600" fill="#111114" dominant-baseline="central">Sigma</text>

