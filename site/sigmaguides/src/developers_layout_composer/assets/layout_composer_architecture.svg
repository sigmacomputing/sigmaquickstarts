<text x="1090" y="451" text-anchor="middle" font-size="12" fill="#5F5F66" dominant-baseline="central">Layout Composer Result</text>

<rect x="980" y="528" width="220" height="80" rx="10" fill="#EEF3FF" stroke="#1A70F1" stroke-width="1.2"/>
