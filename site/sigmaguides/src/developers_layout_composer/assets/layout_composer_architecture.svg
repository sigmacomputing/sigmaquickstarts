<path d="M480 680 L345 680 L345 159 L312 159" fill="none" stroke="#5F5F66" stroke-width="1.4" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="412" y="664" text-anchor="middle" font-size="12.5" fill="#111114" dominant-baseline="central">teams claim in token</text>
