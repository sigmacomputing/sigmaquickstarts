<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" preserveAspectRatio="xMidYMid meet" font-family="'DM Sans', Arial, sans-serif">
<title>Layout Composer</title>
<defs>
